name: Mobile checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Domain behaviour tests
        run: npm test
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Dependency audit report
        run: |
          npm audit --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json'); console.log(JSON.stringify(a.metadata)); for(const [name,v] of Object.entries(a.vulnerabilities||{})) if(v.severity==='high'||v.severity==='critical') console.log(name,JSON.stringify(v));"
      - name: Type check
        run: npm run typecheck
      - name: Expo compatibility
        run: npx expo install --check
      - name: Bundle Android
        run: npm run bundle:android
      - name: Bundle iOS
        run: npm run bundle:ios
      - name: Save resolved dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: |
            package-lock.json
            dependency-audit.json
          if-no-files-found: error
          retention-days: 7
